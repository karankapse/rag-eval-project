[project]
name = "rag-eval"
version = "0.1.0"
description = "Retrieval-augmented QA over arXiv RAG/retrieval/eval papers, with a rigorous evaluation harness."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/ layout: the importable package lives in src/rag, so tests import the
# *installed* package rather than whatever happens to be in the working dir.
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# macOS can flag the editable-install file as "hidden", and Python then ignores it.
# Pointing pytest at src/ directly makes tests work regardless.
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes basics, I = import sorting, B = bugbear (common bugs), UP = modern syntax
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
