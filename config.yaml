# Every tunable knob lives here. Each eval run saves a copy of the resolved
# config next to its metrics, so any number can be traced back to its settings.
# Override any value with an env var: RAG_<SECTION>__<KEY>, e.g. RAG_CHUNKING__SIZE=512

paths:
  data_dir: data            # raw + processed corpus (gitignored)
  index_dir: indexes        # BM25 / vector indexes (gitignored)
  results_dir: results/runs # versioned eval results (committed)

chunking:
  size: 256     # tokens per chunk
  overlap: 32   # tokens shared between neighbouring chunks
